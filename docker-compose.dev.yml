version: '3.8'

services:
  db:
    image: postgres:15-alpine # Usando uma imagem PostgreSQL mais recente
    container_name: furry_friends_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER?ERRO_POSTGRES_USER_NAO_DEFINIDO_NO_ENV}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?ERRO_POSTGRES_PASSWORD_NAO_DEFINIDO_NO_ENV}
      POSTGRES_DB: ${POSTGRES_DB?ERRO_POSTGRES_DB_NAO_DEFINIDO_NO_ENV}
    ports:
      - "5433:5432" # Mapeia a porta do container para o host
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - furry_friends_network

  backend:
    build:
      context: ./furry-friends-agenda-backend # Caminho para o Dockerfile do backend
      dockerfile: Dockerfile
      target: development # Usa o estágio de desenvolvimento para hot-reloading
    container_name: furry_friends_backend_dev
    restart: unless-stopped
    env_file:
      - .env # Use the root .env file
    depends_on:
      db:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3333}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET?ERRO_JWT_SECRET_NAO_DEFINIDO_NO_ENV}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN?ERRO_JWT_EXPIRES_IN_NAO_DEFINIDO_NO_ENV}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://frontend:8080}
    ports:
      - "${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}"
    volumes:
      # Mount source code for development to enable hot-reloading for the backend
      - ./furry-friends-agenda-backend:/usr/src/app
      # Prevent node_modules from host overwriting container's node_modules
      - /usr/src/app/node_modules
    networks:
      - furry_friends_network

  frontend:
    build:
      context: ./furry-friends-agenda-app
      dockerfile: Dockerfile
      target: development-server # Use the development-server stage from the Dockerfile
    container_name: furry_friends_frontend_dev
    env_file:
      - .env # Use the root .env file
    ports:
      - "8080:8080" # Vite dev server port (from vite.config.ts)
    volumes:
      # Mount source code for development to enable hot-reloading for the frontend
      - ./furry-friends-agenda-app:/app
      # Prevent node_modules from host overwriting container's node_modules
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # CHOKIDAR_USEPOLLING: "true" # Uncomment if HMR isn't working in some environments
    depends_on:
      - backend
    networks:
      - furry_friends_network
  
  studio:
    build:
      context: ./furry-friends-agenda-backend
      dockerfile: Dockerfile
      target: development # Prisma Studio needs dev dependencies
    container_name: furry_friends_studio_dev
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - db
    networks:
      - furry_friends_network
    command: ["npx", "prisma", "studio"]

networks:
  furry_friends_network:
    driver: bridge

volumes:
  postgres_data_dev: # Volume para desenvolvimento