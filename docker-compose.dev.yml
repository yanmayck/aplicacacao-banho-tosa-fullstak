version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: furry_friends_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER?ERRO_POSTGRES_USER_NAO_DEFINIDO_NO_ENV}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?ERRO_POSTGRES_PASSWORD_NAO_DEFINIDO_NO_ENV}
      POSTGRES_DB: ${POSTGRES_DB?ERRO_POSTGRES_DB_NAO_DEFINIDO_NO_ENV}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - furry_friends_network

  setup:
    image: node:20-slim
    container_name: furry_friends_setup
    working_dir: /usr/src/app
    env_file:
      - .env
    volumes:
      - ./:/usr/src/app
      - node_modules_root:/usr/src/app/node_modules
      - node_modules_backend:/usr/src/app/apps/backend/node_modules
      - node_modules_frontend:/usr/src/app/apps/frontend/node_modules
      - node_modules_types:/usr/src/app/packages/types/node_modules
    command: npm install
    networks:
      - furry_friends_network

  backend:
    image: node:20-slim
    container_name: furry_friends_backend_dev
    working_dir: /usr/src/app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3333}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET?ERRO_JWT_SECRET_NAO_DEFINIDO_NO_ENV}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN?ERRO_JWT_EXPIRES_IN_NAO_DEFINIDO_NO_ENV}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://frontend:8080}
    ports:
      - "${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}"
    volumes:
      - ./:/usr/src/app
      - node_modules_root:/usr/src/app/node_modules
      - node_modules_backend:/usr/src/app/apps/backend/node_modules
      - node_modules_types:/usr/src/app/packages/types/node_modules
    depends_on:
      db:
        condition: service_started
      setup:
        condition: service_completed_successfully
    networks:
      - furry_friends_network
    command: ["sh", "-c", "npx prisma generate --schema=./apps/backend/prisma/schema.prisma && npm run start:dev --workspace=apps/backend"]

  frontend:
    image: node:20-slim
    container_name: furry_friends_frontend_dev
    working_dir: /usr/src/app
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./:/usr/src/app
      - node_modules_root:/usr/src/app/node_modules
      - node_modules_frontend:/usr/src/app/apps/frontend/node_modules
      - node_modules_types:/usr/src/app/packages/types/node_modules
    environment:
      NODE_ENV: development
    command: sh -c "npm run dev --workspace=apps/frontend -- --host 0.0.0.0 --port 8080"
    depends_on:
      backend:
        condition: service_started
      setup:
        condition: service_completed_successfully
    networks:
      - furry_friends_network
  
  studio:
    image: node:20-slim
    container_name: furry_friends_studio_dev
    working_dir: /usr/src/app
    env_file:
      - .env
    ports:
      - "5555:5555"
    volumes:
      - ./:/usr/src/app
      - node_modules_root:/usr/src/app/node_modules
      - node_modules_backend:/usr/src/app/apps/backend/node_modules
    depends_on:
      db:
        condition: service_started
      setup:
        condition: service_completed_successfully
    networks:
      - furry_friends_network
    command: sh -c "npx prisma studio --schema=./apps/backend/prisma/schema.prisma --hostname 0.0.0.0 --port 5555"

networks:
  furry_friends_network:
    driver: bridge

volumes:
  postgres_data_dev:
  node_modules_root:
  node_modules_backend:
  node_modules_frontend:
  node_modules_types: