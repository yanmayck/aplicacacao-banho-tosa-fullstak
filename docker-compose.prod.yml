version: '3.8'

services:
  backend:
    build:
      context: ./furry-friends-agenda-backend
      dockerfile: Dockerfile
      # No target specified, so it uses the final 'runner' stage by default
    container_name: furry_friends_backend_prod
    restart: unless-stopped
    env_file:
      - .env # Production environment variables (DATABASE_URL, JWT_SECRET, etc.) must be in this file
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3333}
      # DATABASE_URL is expected to be in the .env file, pointing to a production database
      # Example: DATABASE_URL=postgresql://user:password@prod-db-host:5432/prod_db
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS?ERRO_CORS_NAO_DEFINIDO_NO_ENV} # Must be defined for production
    ports:
      - "${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}"
    networks:
      - furry_friends_network

  frontend:
    build:
      context: ./furry-friends-agenda-app
      dockerfile: Dockerfile
      target: production-server # Use the nginx production server stage
    container_name: furry_friends_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80" # Expose nginx on standard HTTP port
    # The VITE_API_BASE_URL used at build time in the frontend should be the public URL of your backend.
    # For this setup to work, you should pass it as a build argument if it's not already baked into the code.
    # Or, more flexibly, configure nginx to pass the correct URL at runtime.
    # For simplicity, we assume the frontend code already knows its backend URL or is configured via environment variables
    # that are handled by the entrypoint script or nginx config.
    depends_on:
      - backend
    networks:
      - furry_friends_network

networks:
  furry_friends_network:
    driver: bridge
